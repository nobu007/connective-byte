[build]
  command = "npm run build:netlify"
  publish = "apps/frontend/out"
  base = "/"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SITE_URL = "https://connectivebyte.com"
  # Analytics - Plausible
  # Note: Set NEXT_PUBLIC_PLAUSIBLE_DOMAIN in Netlify UI environment variables
  # NEXT_PUBLIC_PLAUSIBLE_DOMAIN = "connectivebyte.com"
  NEXT_PUBLIC_PLAUSIBLE_API_HOST = "https://plausible.io"

[functions]
  directory = "netlify/functions"

# Form API endpoints are served by Netlify Functions.
# The same rules also ship in apps/frontend/public/_redirects (baked into the
# published out/ directory) so API-based deploys get them too.
[[redirects]]
  from = "/api/newsletter"
  to = "/.netlify/functions/newsletter"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Security headers and asset caching live in apps/frontend/public/_headers,
# which the static export copies into out/ so they apply to every deploy method.
