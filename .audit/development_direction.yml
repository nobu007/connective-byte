north_star: Build the product so learners join around their own goals and carry through
  purchase, membership rights, material delivery, and continued use consistently.
  Operational completion is judged only by separate evidence of purchase success,
  member rights, material arrival, and cancellation/recovery — never by API acceptance,
  mock success, document volume, or implementation count.
current_milestone: "PURPOSE.md is absent, so the milestone is derived from the constitution's
  binding rules and the current audit state (no constitution audit artifacts exist):
  make provision verifiable — every surviving generated artifact carries the system
  version that produced it with stale artifacts detected and regenerated, and the
  four provision outcomes are confirmed by production-path evidence records rather
  than mocks or API acceptance."
work_axes:
  - id: AX-1
    title: Production-path verification of the four provision outcomes
    rationale: The constitution defines real provision as separate confirmation of purchase
      success, member rights, material arrival, and cancellation/recovery, and no audit
      artifacts exist to demonstrate any of them. Commerce surfaces (shopify-theme,
      newsletter/contact functions, member communication preferences) exist but their
      end-to-end provision claims are currently unproven.
    constitution_link: 'SYSTEM_CONSTITUTION.md: 購入成功・会員権利・教材到達・取り消し/復旧を別々に確認し、API受理やmock成功を実提供にしない'
    acceptance_criteria: Four independent probes exist, each emitting a dated evidence
      record from the production path (commerce purchase state, membership-rights state,
      actual material delivery channel, cancel/recover path). Each record labels its
      evidence class as production, mock, or unverified, and a summary view shows all
      four outcomes with timestamps. No probe reports success from API acceptance or
      mock responses alone.
    deliverable_type: feat
  - id: AX-2
    title: Version-stamped generation and stale-artifact enforcement
    rationale: The newest codified constitution rule requires version-stamped artifacts
      and regeneration of all surviving generated artifacts after any system (prompt/code)
      update, declaring mechanisms that keep serving stale artifacts 不合格. The rule exists
      only as prose today; no visible mechanism enumerates artifacts and their versions.
    constitution_link: 'SYSTEM_CONSTITUTION.md: 生成物は作られたときのシステムversionを記録する…版を記録しない生成機構・更新後もstale生成物が投稿/提供され続ける機構は不合格（再生成は生存物のみ）'
    acceptance_criteria: Every generation mechanism producing surviving artifacts in
      this repo stamps the current system version at creation. A checker enumerates
      surviving artifacts, flags any whose recorded version differs from current, and
      a regeneration step updates exactly those (never non-surviving past artifacts).
      Serving or publishing a stale artifact after a system update fails the check.
    deliverable_type: feat
  - id: AX-3
    title: Public/private boundary guard and runtime-artifact hygiene
    rationale: The constitution forbids mixing credentials, customer data, or unpublished
      materials into public artifacts and fixtures, and forbids leaking unpublished
      materials. Runtime directories have previously leaked into a PR and required manual
      removal, indicating the guard is procedural rather than enforced.
    constitution_link: 'SYSTEM_CONSTITUTION.md: 認証情報・顧客情報・未公開教材を公開成果物やfixtureへ混入させない'
    acceptance_criteria: A pre-commit/CI guard scans public artifacts and fixtures for
      credential patterns, customer-identifying data, and unpublished-material markers,
      and demonstrably blocks a planted violation. Runtime artifact paths (test results,
      session snapshots, logs, wrangler cache) are excluded by ignore rules so a full
      test run leaves git status clean.
    deliverable_type: fix
  - id: AX-4
    title: Operational evidence loop from customer outcomes into improvement
    rationale: The constitution requires customer reach results and failure-recovery
      evidence to feed back into improvement, with explicit rejection of document-count-based
      completion judgment. The absence of any audit artifacts shows this loop is unmaterialized,
      which is also why recent iterations drifted toward prose alignment.
    constitution_link: 'SYSTEM_CONSTITUTION.md: 顧客の到達結果と障害復旧の証拠を改善へ戻す。文書量・実装件数だけで運営完成と判定しない'
    acceptance_criteria: 'An append-only evidence store (schema: date, kind in {reach,
      delivery-failure, recovery}, source probe, outcome, evidence class) is written
      by the AX-1 probes, and a summary command lists unresolved failures/recoveries
      as concrete improvement candidates. Entries respect the public/private boundary;
      any completion claim must cite evidence records rather than counts of documents
      or implementations.'
    deliverable_type: feat
feature_gaps:
  - No constitution audit or evidence artifacts exist at all — the required loop from
    customer reach results and failure recovery back into improvement has no store,
    schema, or review step.
  - 'Version-stamp compliance is unproven: no visible mechanism enumerates surviving
    generated artifacts with their recorded generation version, flags mismatches after
    system updates, or blocks stale artifacts from being served.'
  - The four provision outcomes (purchase success, member rights, material arrival,
    cancellation/recovery) have no separate production-path verification despite commerce
    surfaces (shopify-theme, newsletter functions, member communication preferences)
    being present.
  - No verified guard keeps credentials, customer data, and unpublished materials out
    of public artifacts and fixtures; runtime artifact directories have entered version
    control at least once before.
  - README advertises a full Next.js 15 + Express feature set while the codebase inventory
    shows a small TypeScript surface — implemented vs. advertised product scope is unreconciled
    (inventory depth unverified; confirm before relying on advertised capabilities).
anti_patterns:
  - Further constitution/automation/ordering prose-alignment passes — several recent
    commits were exactly this, and the constitution itself rejects document volume as
    a completion signal; edit governing docs only when a contract actually changes.
  - Another robustness pass on the backend logging performance tests — two consecutive
    passes already made them load- and parallel-immune; a third covers no new behavior.
  - Committing runtime artifacts (test-results/, session snapshots, .log files, wrangler
    cache) or one-off drop-snapshots-from-PR cleanups; fix the ignore rules once instead
    of repeated sweep PRs.
  - 'Mock-success demonstrations: test fixtures or local mock responses presented as
    proof of purchase, membership rights, or material delivery — explicitly disqualified
    by the constitution.'
  - Reinventing canonical definitions (意味定義・顧客文脈・商品版) or new marketing copy from screens/README
    text instead of implementing against the existing canonical docs.
  - Regenerating non-surviving past artifacts to chase version parity — the constitution
    scopes regeneration to surviving artifacts only.
  - Cosmetic refactors of shopify-theme or frontend styling with no effect on the provision
    chain, version compliance, or the public/private boundary.
