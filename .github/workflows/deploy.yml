name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend to Netlify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # actions-netlify silently skips deploying when credentials are missing,
      # which makes the job green while nothing is deployed. Fail explicitly.
      - name: Verify Netlify credentials
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are not configured."
            echo "::error::Set them in Settings → Secrets and variables → Actions (see DEPLOYMENT_GUIDE.md)."
            exit 1
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend
        env:
          NODE_ENV: production

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './apps/frontend/out'
          functions-dir: './netlify/functions'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions - ${{ github.sha }}'
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check frontend health
        run: |
          FRONTEND_URL="${{ secrets.PRODUCTION_FRONTEND_URL || 'https://connectivebyte.netlify.app' }}"
          echo "Checking frontend at: $FRONTEND_URL"

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ Frontend is healthy (HTTP $STATUS_CODE)"
          else
            echo "❌ Frontend health check failed (HTTP $STATUS_CODE)"
            exit 1
          fi
